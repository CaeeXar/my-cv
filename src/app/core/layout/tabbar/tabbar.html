<div class="tab-wrapper">
  <div
    #scrollContainer
    (wheel)="onScroll($event, scrollContainer)"
    (scroll)="onScrollUpdate(scrollContainer)"
    class="tab-scroll-area"
  >
    @for (tab of tabs(); track tab.id) {
      <div
        (click)="selectTab(tab.id)"
        class="flex h-full shrink-0 items-center gap-2 border-r border-border px-4 text-sm cursor-pointer whitespace-nowrap box-border"
        [class]="
          tab.id === activeTabId()
            ? 'border-t-2 border-t-accent-purple border-b border-b-editor bg-tab-active text-text-main'
            : 'border-t border-t-transparent border-b border-border bg-tab-inactive text-text-muted hover:bg-surface hover:text-text-main transition-colors'
        "
      >
        <span [class]="tab.iconColor">{{ tab.iconText }}</span>
        <span>{{ tab.label }}</span>
      </div>
    }
  </div>

  @if (hasOverflow()) {
    <div class="scroll-track">
      <div
        class="scroll-thumb"
        [style.left.%]="thumbLeft()"
        [style.width.%]="thumbWidth()"
      ></div>
    </div>
  }
</div>
