<div class="flex h-full w-full min-w-0 overflow-hidden">
  <!-- SCROLL AREA -->
  <div class="flex h-full flex-1 min-w-0 overflow-x-auto overflow-y-hidden">
    @for (tab of tabs(); track tab.id) {
      <div
        (click)="selectTab(tab.id)"
        class="flex h-full shrink-0 items-center gap-2 border-r border-border px-4 text-sm cursor-pointer whitespace-nowrap box-border"
        [class]="
          tab.id === activeTabId()
            ? 'border-t-2 border-t-accent-purple border-b border-b-editor bg-tab-active text-text-main'
            : 'border-t border-t-border bg-tab-inactive text-text-muted hover:bg-surface hover:text-text-main transition-colors'
        "
      >
        <span [class]="tab.iconColor">{{ tab.iconText }}</span>
        <span class="truncate leading-none">{{ tab.label }}</span>
      </div>
    }
  </div>
</div>
