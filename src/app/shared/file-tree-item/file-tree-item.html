@if (node().type === 'file') {
  <a
    [routerLink]="node().route"
    routerLinkActive="bg-list-active !text-text-main"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex h-8 w-full items-center gap-2 text-sm text-text-muted hover:bg-surface-hover hover:text-text-main transition-colors border-l-2 border-transparent [&.bg-list-active]:border-accent-purple"
    [style.padding-left.rem]="(depth() + 1) * 0.75"
  >
    <ng-icon
      [name]="node().icon || 'bootstrapFileEarmarkCode'"
      size="16"
      class="text-accent-purple"
    />

    <span class="truncate">
      {{ node().label }}
    </span>
  </a>
}

@if (node().type === 'folder') {
  <div>
    <button
      type="button"
      (click)="toggle()"
      class="flex h-8 w-full items-center gap-1 text-sm text-text-main hover:bg-surface-hover transition-colors border-l-2 border-transparent"
      [style.padding-left.rem]="(depth() + 1) * 0.75"
    >
      @if (expanded()) {
        <ng-icon name="bootstrapChevronDown" size="16" class="text-text-muted" />
      } @else {
        <ng-icon name="bootstrapChevronRight" size="16" class="text-text-muted" />
      }

      <span class="truncate font-semibold tracking-wide">
        {{ node().label }}
      </span>
    </button>

    @if (expanded()) {
      <div>
        @for (child of node().children; track child.id) {
          <app-file-tree-item [node]="child" [depth]="depth() + 1" />
        }
      </div>
    }
  </div>
}
